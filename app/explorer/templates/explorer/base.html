<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Atlas</title>
    <style>
        :root {
            /* MacOS Light Theme Variables */
            --bg-color: #f5f5f7;
            /* Light gray background */
            --card-bg: #ffffff;
            /* White cards */
            --text-primary: #1d1d1f;
            /* Almost black text */
            --text-secondary: #86868b;
            /* Gray text */
            --accent: #0071e3;
            /* Apple Blue */
            --border: #d2d2d7;
            /* UI Border */
            --success: #34c759;
            /* Apple Green */
            --error: #ff3b30;
            /* Apple Red */
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.12), 0 1px 2px rgba(0, 0, 0, 0.24);
            --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --radius: 12px;
            --radius-sm: 8px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 16px;
            letter-spacing: -0.3px;
        }

        h3 {
            font-size: 16px;
            font-weight: 600;
        }

        a {
            color: var(--accent);
            text-decoration: none;
            transition: opacity 0.2s;
        }

        a:hover {
            opacity: 0.8;
            text-decoration: none;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(0, 0, 0, 0.05);
            /* Very subtle border */
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-card);
        }

        input,
        select,
        textarea {
            width: 100%;
            background: #ffffff;
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            margin-bottom: 16px;
            font-family: inherit;
            font-size: 14px;
            box-sizing: border-box;
            /* Fix sizing */
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.2);
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            opacity: 1;
            /* Override old opacity */
            background: #0077ED;
            /* Slightly lighter */
        }

        button:active {
            transform: scale(0.98);
        }

        .alert {
            padding: 16px;
            border-radius: var(--radius-sm);
            margin-bottom: 24px;
            font-size: 14px;
        }

        .alert-success {
            background: #eafbf0;
            color: #1e7e34;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #fdf2f2;
            color: #dc3545;
            border: 1px solid #f5c6cb;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            font-size: 14px;
        }

        th,
        td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }

        th {
            color: var(--text-secondary);
            font-weight: 600;
            background: #fafafa;
        }

        tr:last-child td {
            border-bottom: none;
        }

        pre {
            background: #f5f5f7;
            /* Light gray for code block bg */
            color: #1d1d1f;
            padding: 16px;
            border-radius: var(--radius-sm);
            overflow-x: auto;
            border: 1px solid var(--border);
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1><a href="{% url 'explorer:index' %}" style="text-decoration:none; color:inherit;">Data Atlas</a></h1>
            <nav>
                <a href="{% url 'explorer:index' %}" class="btn">Connections</a>
            </nav>
        </header>

        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </div>
</body>

</html>
